<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Olievenhoutbosch Digital Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --plum: #230344;
            --rose-gold: #f8c9c0;
            --light-grey: #f4f7f6;
        }
        body {
            background-color: var(--light-grey);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .offline-icon {
            font-size: 4rem;
            color: var(--plum);
            margin-bottom: 20px;
        }
        .btn-plum {
            background-color: var(--plum);
            color: white;
            border-radius: 50px;
            padding: 12px 30px;
            border: none;
            font-weight: bold;
        }
        .cached-pages {
            margin-top: 20px;
            text-align: left;
        }
        .cached-pages a {
            color: var(--plum);
            text-decoration: none;
            display: block;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h3 class="fw-bold mb-3" style="color: var(--plum);">You're Offline</h3>
        <p class="text-muted mb-4">
            It looks like your internet connection is down. Don't worry — you can still view pages you visited before.
        </p>
        
        <div class="cached-pages">
            <h6 class="fw-bold mb-3">Previously viewed pages:</h6>
            <div id="cachedList">
                <p class="text-muted small">Loading cached pages...</p>
            </div>
        </div>
        
        <button class="btn btn-plum mt-4 w-100" onclick="window.location.reload()">
            Try Again
        </button>
    </div>

    <script>
        // List cached pages the user can access
        if ('caches' in window) {
            caches.open('olieven-hub-v1').then((cache) => {
                cache.keys().then((requests) => {
                    const list = document.getElementById('cachedList');
                    const pages = requests
                        .filter(req => req.url.includes('.php') && !req.url.includes('offline'))
                        .map(req => {
                            const url = new URL(req.url);
                            return `<a href="${url.pathname}${url.search}">${url.pathname}</a>`;
                        });
                    
                    if (pages.length > 0) {
                        list.innerHTML = pages.join('');
                    } else {
                        list.innerHTML = '<p class="text-muted small">No pages cached yet. Visit some pages while online first.</p>';
                    }
                });
            });
        }
    </script>
</body>
</html>
