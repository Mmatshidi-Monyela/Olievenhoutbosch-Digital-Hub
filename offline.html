<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Olievenhoutbosch Digital Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --plum: #230344;
            --light-grey: #e6e6e6;
        }
        body {
            background-color: var(--light-grey);
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .offline-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        .btn-plum {
            background-color: var(--plum) !important;
            color: white !important;
            border-radius: 50px;
            padding: 12px 30px;
            border: none;
            font-weight: bold;
            width: 100%;
        }
        .btn-plum:hover {
            background-color: #3a0d5e !important;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="bi bi-wifi-off" style="font-size: 3.5rem; color: var(--plum);"></i>
        </div>
        <h3 class="fw-bold mb-2" style="color: var(--plum);">You're Offline</h3>
        <p class="text-muted mb-4">
            Your internet connection appears to be down. Pages you visited recently are still available.
        </p>
        <button class="btn btn-plum" onclick="window.location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
